<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f5" />
    <meta name="description" content="BloodLink donation operations admin portal" />
    <title>BloodLink | Operations</title>
    <link rel="stylesheet" href="../assets/styles/admin.css" />
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></symbol>
      <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-4-7-13-7-13S5 11 5 15a7 7 0 0 0 7 7Z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 2Z" transform="translate(-1 -1)"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    </svg>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard" aria-label="BloodLink home">
          <span class="brand-mark"><svg class="icon"><use href="#i-drop"/></svg></span>
          <span class="brand-name">blood<span>link</span><small>CARE NETWORK</small></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <a class="nav-link active" href="#dashboard" data-page="dashboard"><svg class="icon"><use href="#i-grid"/></svg><span>Overview</span></a>
          <a class="nav-link" href="#donors" data-page="donors"><svg class="icon"><use href="#i-users"/></svg><span>Donors</span><span class="nav-count" id="donor-count">0</span></a>
          <a class="nav-link" href="#requests" data-page="requests"><svg class="icon"><use href="#i-heart"/></svg><span>Blood requests</span><span class="nav-count alert-count">6</span></a>
          <a class="nav-link" href="#inventory" data-page="inventory"><svg class="icon"><use href="#i-drop"/></svg><span>Inventory</span></a>
          <a class="nav-link" href="#appointments" data-page="appointments"><svg class="icon"><use href="#i-calendar"/></svg><span>Appointments</span></a>
          <a class="nav-link" href="#reports" data-page="reports"><svg class="icon"><use href="#i-chart"/></svg><span>Reports</span></a>
        </nav>
        <div class="sidebar-bottom">
          <a class="nav-link" href="#settings" data-page="settings"><svg class="icon"><use href="#i-settings"/></svg><span>Settings</span></a>
          <div class="sidebar-help"><span class="help-icon">?</span><div><strong>Need a hand?</strong><small>Visit the support center</small></div><svg class="icon"><use href="#i-arrow"/></svg></div>
          <div class="profile"><div class="avatar avatar-admin">AM</div><div class="profile-copy"><strong>Alex Morgan</strong><small>Network administrator</small></div><button class="icon-button profile-menu" title="Profile options" aria-label="Profile options"><svg class="icon"><use href="#i-more"/></svg></button></div>
        </div>
      </aside>
      <main class="main-area">
        <header class="topbar">
          <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Open navigation"><svg class="icon"><use href="#i-menu"/></svg></button>
          <div class="breadcrumb"><span>BloodLink</span><span class="crumb-separator">/</span><strong id="breadcrumb-page">Overview</strong></div>
          <div class="topbar-actions">
            <label class="global-search"><svg class="icon"><use href="#i-search"/></svg><input id="global-search" type="search" placeholder="Search anything..." aria-label="Search anything" /><kbd>⌘ K</kbd></label>
            <button class="icon-button notification-button" id="notification-button" aria-label="Notifications"><svg class="icon"><use href="#i-bell"/></svg><i></i></button>
            <span class="topbar-divider"></span>
            <div class="date-chip"><span class="date-dot"></span><span>Wed, Oct 29, 2026</span></div>
          </div>
        </header>
        <div class="page-content" id="page-content"></div>
      </main>
    </div>
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header"><div><span class="eyebrow" id="modal-eyebrow">NEW RECORD</span><h2 id="modal-title">Create blood request</h2></div><button class="icon-button" id="modal-close" aria-label="Close dialog"><svg class="icon"><use href="#i-close"/></svg></button></div>
        <form id="record-form"><div class="form-fields" id="form-fields"></div><div class="form-actions"><button class="button button-quiet" type="button" id="modal-cancel">Cancel</button><button class="button button-primary" type="submit" id="modal-submit">Create request</button></div></form>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="../assets/scripts/admin.js"></script>
  </body>
</html>
